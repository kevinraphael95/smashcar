<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmashCar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="header">
    <div class="logo">SmashCar</div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" role="tab" aria-selected="true"  onclick="switchTab('game')"   id="tab-game">🏁 Vote</button>
    <button class="tab"        role="tab" aria-selected="false" onclick="switchTab('garage')" id="tab-garage">
      🏎 Garage <span class="badge" id="garageBadge">0</span>
    </button>
  </div>

  <!-- ══════════════ GAME VIEW ══════════════ -->
  <section class="view active" id="view-game" role="tabpanel">

    <div class="scorebar">
      <div class="score-pill">
        <div class="score-dot pass"></div>
        <span class="score-label">Pass</span>
        <div class="score-num pass" id="passScore">0</div>
      </div>
      <div class="score-pill">
        <div class="score-dot smash"></div>
        <span class="score-label">Smash</span>
        <div class="score-num smash" id="smashScore">0</div>
      </div>
    </div>

    <div class="deck" id="deck">
      <div class="card ghost" id="cGhost"><div class="skel"></div></div>
      <div class="card back"  id="cBack" ><div class="skel"></div></div>
      <div class="card mid"   id="cMid"  ><div class="skel"></div></div>
      <div class="card front" id="cFront" tabindex="0" aria-label="Carte voiture">
        <div class="skel" id="sFront"></div>
        <img class="car-img" id="imgFront" alt="Voiture en cours"/>
        <div class="card-grad"></div>
        <div class="card-top-grad">
          <span class="car-num" id="cardNum">#1</span>
          <span class="origin-flag" id="cardFlag"></span>
        </div>
        <div class="card-info">
          <div class="car-category" id="cardCat">⚡ Hypercar</div>
          <div class="car-make" id="cardMake">Chargement…</div>
          <div class="car-title-row">
            <div class="car-model" id="cardModel"></div>
            <div class="car-year"  id="cardYear"></div>
          </div>
          <div class="car-stats" id="cardStats"></div>
          <div class="car-desc"  id="cardDesc"></div>
        </div>
        <div class="vind smash" id="vindSmash" aria-hidden="true">SMASH ✓</div>
        <div class="vind pass"  id="vindPass"  aria-hidden="true">PASS ✗</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-pass"  id="btnPass"  onclick="vote('pass')"  disabled aria-label="Passer cette voiture">✕ Pass</button>
      <button class="btn-info"                    onclick="openDetail()"  title="Détails" aria-label="Voir les détails">ℹ</button>
      <button class="btn btn-smash" id="btnSmash" onclick="vote('smash')" disabled aria-label="Smash cette voiture">♥ Smash</button>
    </div>

    <p class="hint">← Swipe gauche pour passer · Swipe droite pour smash →</p>
    <p class="hint hint-kb">A / ← Pass &nbsp;·&nbsp; D / → Smash &nbsp;·&nbsp; I Infos</p>

  </section>

  <!-- ══════════════ GARAGE VIEW ══════════════ -->
  <section class="view" id="view-garage" role="tabpanel">
    <div class="garage-header">
      <div class="garage-title">🏎 Mon Garage</div>
      <div class="garage-count" id="garageCount">0 voiture(s) smashée(s)</div>
    </div>
    <div id="garageContent">
      <div class="garage-empty">
        <div class="icon">🏁</div>
        <p>Ton garage est vide.<br>Commence à voter pour remplir<br>ta collection de rêve !</p>
      </div>
    </div>
  </section>

  <!-- ══════════════ DETAIL MODAL ══════════════ -->
  <div class="modal-backdrop hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <div class="modal" id="modalBox">
      <div class="modal-img-wrap">
        <img class="modal-img" id="modalImg" alt="Voiture détail"/>
        <div class="modal-img-grad"></div>
        <div class="modal-img-badge" id="modalBadge"></div>
      </div>
      <div class="modal-body">
        <div class="modal-make" id="modalMake"></div>
        <div class="modal-name" id="modalName"></div>
        <div class="modal-stats" id="modalStats"></div>
        <div class="modal-price" id="modalPrice"></div>
        <div class="modal-desc"  id="modalDesc"></div>
        <button class="modal-close" onclick="closeModal()" aria-label="Fermer la modale">Fermer</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
