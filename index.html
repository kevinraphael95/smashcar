<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmashCar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  
  <style>
    :root {
      --bg: #09090b;
      --surface: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f3f4f6;
      --muted: #8a8f9d;
      --red: #ff2a5f;
      --green: #20e070;
      --accent: #e5c158;
      --card-w: clamp(310px, 90vw, 380px);
      --card-h: clamp(500px, 78vw, 580px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px;
      overflow-x: hidden;
    }

    /* Top Bar Tinder Style */
    header {
      width: 100%;
      max-width: var(--card-w);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px 16px;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff2a5f 0%, #e5c158 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      position: relative;
    }

    .badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: var(--green);
      color: #000;
      font-size: 0.65rem;
      font-weight: 800;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Deck 3D */
    .deck {
      position: relative;
      width: var(--card-w);
      height: var(--card-h);
      perspective: 1000px;
      margin-bottom: 20px;
    }

    .card {
      position: absolute;
      inset: 0;
      border-radius: 28px;
      overflow: hidden;
      background: #111118;
      border: 1px solid var(--border);
      box-shadow: 0 15px 35px rgba(0,0,0,0.7);
      touch-action: none;
      user-select: none;
    }

    .card.front { z-index: 3; cursor: grab; }
    .card.front:active { cursor: grabbing; }

    .card-img-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      background: #151520;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .img-loader {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #10101a;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(9, 9, 11, 0.95) 20%, rgba(9, 9, 11, 0.2) 60%, transparent 100%);
    }

    .card-content {
      position: absolute;
      bottom: 0;
      inset-x: 0;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .car-category {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      font-weight: 700;
    }

    .car-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .car-subtitle {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .car-specs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 4px;
    }

    .spec-item {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 6px 4px;
      text-align: center;
    }

    .spec-val {
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .spec-lbl {
      font-size: 0.6rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* Tinder Style Action Buttons */
    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      width: var(--card-w);
    }

    .btn-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      background: #111118;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-circle:active { transform: scale(0.88); }
    .btn-pass { color: var(--red); border: 2px solid var(--red); }
    .btn-smash { color: var(--green); border: 2px solid var(--green); width: 72px; height: 72px; font-size: 1.9rem; }

    /* Stamps Swipe */
    .stamp {
      position: absolute;
      top: 40px;
      padding: 6px 16px;
      border-radius: 12px;
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      border: 4px solid;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease;
      z-index: 5;
    }
    .stamp.smash { left: 24px; color: var(--green); border-color: var(--green); transform: rotate(-15deg); }
    .stamp.pass { right: 24px; color: var(--red); border-color: var(--red); transform: rotate(15deg); }

    /* Modal Garage */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: 20px;
    }

    .modal.active { display: flex; }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .garage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      overflow-y: auto;
      padding-bottom: 20px;
    }

    .garage-card {
      background: #111118;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 3/4;
      position: relative;
    }

    .garage-card img { width: 100%; height: 100%; object-fit: cover; }
    .garage-card-info {
      position: absolute;
      bottom: 0; inset-x: 0;
      padding: 8px;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    }
    .garage-card-name { font-size: 0.8rem; font-weight: 700; }
  </style>
</head>
<body>

  <header>
    <div class="logo">SmashCar</div>
    <button class="icon-btn" onclick="toggleGarage()">
      ⚙️
      <span class="badge" id="gBadge">0</span>
    </button>
  </header>

  <!-- DECK PRINCIPAL -->
  <div class="deck">
    <div class="card front" id="cFront">
      <div class="card-img-wrap">
        <div class="img-loader" id="loader">Recherche de la photo...</div>
        <img class="card-img" id="cardImg" alt="Car" style="display:none;" />
        <div class="card-overlay"></div>
        <div class="stamp smash" id="stampSmash">SMASH</div>
        <div class="stamp pass" id="stampPass">PASS</div>
      </div>
      <div class="card-content">
        <div>
          <span class="car-category" id="carCat">Catégorie</span>
          <h2 class="car-title" id="carName">Marque Modèle</h2>
          <p class="car-subtitle" id="carSub">Origine · Année</p>
        </div>

        <div class="car-specs">
          <div class="spec-item">
            <div class="spec-val" id="specHp">-</div>
            <div class="spec-lbl">Puissance</div>
          </div>
          <div class="spec-item">
            <div class="spec-val" id="specEngine">-</div>
            <div class="spec-lbl">Moteur</div>
          </div>
          <div class="spec-item">
            <div class="spec-val" id="specYear">-</div>
            <div class="spec-lbl">Année</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- BOUTONS TINDER -->
  <div class="actions">
    <button class="btn-circle btn-pass" onclick="handleVote(false)">✖</button>
    <button class="btn-circle btn-smash" onclick="handleVote(true)">💚</button>
  </div>

  <!-- MODAL GARAGE (REGLAGES) -->
  <div class="modal" id="garageModal">
    <div class="modal-header">
      <h2>🏎 Garage (Smashed)</h2>
      <button class="icon-btn" onclick="toggleGarage()">✕</button>
    </div>
    <div class="garage-grid" id="garageGrid"></div>
  </div>

  <script>
    const MODELS = [
      { make: "Peugeot", model: "208", cat: "Citadine", year: "2023", flag: "🇫🇷", hp: "100 ch", engine: "Essence" },
      { make: "Renault", model: "Clio 5", cat: "Citadine", year: "2022", flag: "🇫🇷", hp: "90 ch", engine: "Essence" },
      { make: "Volkswagen", model: "Golf GTI", cat: "Compacte", year: "2021", flag: "🇩🇪", hp: "245 ch", engine: "Turbo 2.0L" },
      { make: "BMW", model: "M3 Competition", cat: "Berline Sport", year: "2022", flag: "🇩🇪", hp: "510 ch", engine: "6 en ligne" },
      { make: "Audi", model: "RS6 Avant", cat: "Break", year: "2023", flag: "🇩🇪", hp: "600 ch", engine: "V8 Biturbo" },
      { make: "Porsche", model: "911 GT3 RS", cat: "Supercar", year: "2023", flag: "🇩🇪", hp: "525 ch", engine: "Flat-6 Atmo" },
      { make: "Tesla", model: "Model 3", cat: "Électrique", year: "2023", flag: "🇺🇸", hp: "283 ch", engine: "Électrique" },
      { make: "Toyota", model: "Yaris GR", cat: "Sportive", year: "2021", flag: "🇯🇵", hp: "261 ch", engine: "Turbo 1.6L" },
      { make: "Ford", model: "Mustang GT", cat: "Muscle Car", year: "2020", flag: "🇺🇸", hp: "450 ch", engine: "V8 5.0L" },
      { make: "Lamborghini", model: "Urus", cat: "SUV Sportif", year: "2021", flag: "🇮🇹", hp: "650 ch", engine: "V8 Biturbo" },
      { make: "Ferrari", model: "F40", cat: "Légende", year: "1987", flag: "🇮🇹", hp: "478 ch", engine: "V8 Biturbo" },
      { make: "Alpine", model: "A110", cat: "Coupé Sport", year: "2022", flag: "🇫🇷", hp: "252 ch", engine: "Turbo 1.8L" }
    ];

    let currentQueue = [];
    let garage = [];
    let isAnimating = false;

    async function fetchCarImage(query) {
      const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query + ' car')}&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=800&format=json&origin=*`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.query && data.query.pages) {
          const pageId = Object.keys(data.query.pages)[0];
          return data.query.pages[pageId].thumbnail.source;
        }
      } catch (e) {
        console.error("Erreur API Image:", e);
      }
      return `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"><rect width="800" height="600" fill="%23151520"/><text x="50%" y="50%" fill="%238a8f9d" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="30">${encodeURIComponent(query)}</text></svg>`;
    }

    async function initQueue() {
      const shuffled = [...MODELS].sort(() => Math.random() - 0.5);
      currentQueue = shuffled;
      await renderCurrentCard();
    }

    async function renderCurrentCard() {
      if (currentQueue.length === 0) await initQueue();
      
      const loader = document.getElementById('loader');
      const imgEl = document.getElementById('cardImg');
      
      loader.style.display = 'flex';
      imgEl.style.display = 'none';

      const car = currentQueue[0];
      const imgUrl = await fetchCarImage(`${car.make} ${car.model}`);
      car.img = imgUrl;
      
      document.getElementById('carCat').textContent = car.cat;
      document.getElementById('carName').textContent = `${car.make} ${car.model}`;
      document.getElementById('carSub').textContent = `${car.flag} Origine · ${car.year}`;
      
      document.getElementById('specHp').textContent = car.hp;
      document.getElementById('specEngine').textContent = car.engine;
      document.getElementById('specYear').textContent = car.year;

      imgEl.src = car.img;
      imgEl.onload = () => {
        loader.style.display = 'none';
        imgEl.style.display = 'block';
      };
    }

    async function handleVote(isSmash) {
      if (isAnimating || currentQueue.length === 0) return;
      isAnimating = true;

      const card = document.getElementById('cFront');
      const currentCar = currentQueue.shift();

      if (isSmash) {
        garage.push(currentCar);
        document.getElementById('gBadge').textContent = garage.length;
        card.style.transform = 'translateX(150%) rotate(20deg)';
      } else {
        card.style.transform = 'translateX(-150%) rotate(-20deg)';
      }

      setTimeout(async () => {
        card.style.transition = 'none';
        card.style.transform = 'none';
        document.getElementById('stampSmash').style.opacity = '0';
        document.getElementById('stampPass').style.opacity = '0';
        
        await renderCurrentCard();
        
        setTimeout(() => {
          card.style.transition = '';
          isAnimating = false;
        }, 50);
      }, 300);
    }

    function toggleGarage() {
      const modal = document.getElementById('garageModal');
      modal.classList.toggle('active');
      if (modal.classList.contains('active')) {
        const grid = document.getElementById('garageGrid');
        grid.innerHTML = garage.map(c => `
          <div class="garage-card">
            <img src="${c.img}" alt="${c.model}"/>
            <div class="garage-card-info">
              <div class="garage-card-name">${c.make} ${c.model}</div>
            </div>
          </div>
        `).join('');
      }
    }

    // Drag Swipe Tactile
    const front = document.getElementById('cFront');
    let startX = 0, currentX = 0;

    front.addEventListener('pointerdown', e => {
      if (isAnimating) return;
      startX = e.clientX;
      front.style.transition = 'none';
    });

    front.addEventListener('pointermove', e => {
      if (!startX) return;
      currentX = e.clientX - startX;
      const rot = currentX * 0.05;
      front.style.transform = `translateX(${currentX}px) rotate(${rot}deg)`;
      
      const ratio = Math.min(Math.abs(currentX) / 100, 1);
      if (currentX > 0) {
        document.getElementById('stampSmash').style.opacity = ratio;
        document.getElementById('stampPass').style.opacity = 0;
      } else {
        document.getElementById('stampPass').style.opacity = ratio;
        document.getElementById('stampSmash').style.opacity = 0;
      }
    });

    front.addEventListener('pointerup', () => {
      if (!startX) return;
      if (currentX > 100) handleVote(true);
      else if (currentX < -100) handleVote(false);
      else {
        front.style.transition = 'transform 0.2s ease';
        front.style.transform = 'none';
        document.getElementById('stampSmash').style.opacity = '0';
        document.getElementById('stampPass').style.opacity = '0';
      }
      startX = 0;
      currentX = 0;
    });

    initQueue();
  </script>
</body>
</html>
