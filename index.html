<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmashCar - 100% API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  
  <style>
    :root {
      --bg: #09090b;
      --surface: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f3f4f6;
      --muted: #8a8f9d;
      --red: #ff2a5f;
      --green: #20e070;
      --accent: #e5c158;
      --card-w: clamp(310px, 90vw, 380px);
      --card-h: clamp(500px, 78vw, 580px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: var(--card-w);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px 16px;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff2a5f 0%, #e5c158 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      position: relative;
    }

    .badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: var(--green);
      color: #000;
      font-size: 0.65rem;
      font-weight: 800;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .deck {
      position: relative;
      width: var(--card-w);
      height: var(--card-h);
      perspective: 1000px;
      margin-bottom: 20px;
    }

    .card {
      position: absolute;
      inset: 0;
      border-radius: 28px;
      overflow: hidden;
      background: #111118;
      border: 1px solid var(--border);
      box-shadow: 0 15px 35px rgba(0,0,0,0.7);
      touch-action: none;
      user-select: none;
      will-change: transform;
    }

    .card.front { z-index: 3; cursor: grab; }
    .card.front:active { cursor: grabbing; }

    .card-img-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      background: #151520;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .img-loader {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #10101a;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 20px;
    }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(9, 9, 11, 0.95) 20%, rgba(9, 9, 11, 0.2) 60%, transparent 100%);
      pointer-events: none;
    }

    .card-content {
      position: absolute;
      bottom: 0;
      inset-x: 0;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
    }

    .car-category {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      font-weight: 700;
    }

    .car-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .car-subtitle {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .car-specs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 4px;
    }

    .spec-item {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 6px 4px;
      text-align: center;
    }

    .spec-val {
      font-family: 'Syne', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .spec-lbl {
      font-size: 0.6rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      width: var(--card-w);
    }

    .btn-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      background: #111118;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-circle:active { transform: scale(0.88); }
    .btn-pass { color: var(--red); border: 2px solid var(--red); }
    .btn-smash { color: var(--green); border: 2px solid var(--green); width: 72px; height: 72px; font-size: 1.9rem; }

    .stamp {
      position: absolute;
      top: 40px;
      padding: 6px 16px;
      border-radius: 12px;
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      border: 4px solid;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }
    .stamp.smash { left: 24px; color: var(--green); border-color: var(--green); transform: rotate(-15deg); }
    .stamp.pass { right: 24px; color: var(--red); border-color: var(--red); transform: rotate(15deg); }

    /* Correction Modals & Overflows */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }

    .modal.active { display: flex; }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .garage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 30px;
    }

    .garage-card {
      background: #111118;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      height: 170px;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .garage-card:hover { transform: scale(1.03); }
    .garage-card img { width: 100%; height: 100%; object-fit: cover; }
    .garage-card-info {
      position: absolute;
      bottom: 0; inset-x: 0;
      padding: 8px;
      background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
    }
    .garage-card-name { font-size: 0.75rem; font-weight: 700; color: #fff; text-shadow: 0 1px 2px #000; }

    .detail-card {
      background: #111118;
      border: 1px solid var(--border);
      border-radius: 24px;
      max-width: 400px;
      width: 100%;
      margin: auto;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .detail-img { width: 100%; height: 240px; object-fit: cover; }
    .detail-body { padding: 20px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">SmashCar</div>
    <button class="icon-btn" onclick="toggleGarage()">
      🏎
      <span class="badge" id="gBadge">0</span>
    </button>
  </header>

  <div class="deck">
    <div class="card front" id="cFront">
      <div class="card-img-wrap">
        <div class="img-loader" id="loader">Connexion à l'API Wikidata...</div>
        <img class="card-img" id="cardImg" alt="Car" style="display:none;" />
        <div class="card-overlay"></div>
        <div class="stamp smash" id="stampSmash">SMASH</div>
        <div class="stamp pass" id="stampPass">PASS</div>
      </div>
      <div class="card-content" id="cardContent" style="display: none;">
        <div>
          <span class="car-category" id="carCat">Automobile</span>
          <h2 class="car-title" id="carName">-</h2>
          <p class="car-subtitle" id="carSub">-</p>
        </div>

        <div class="car-specs">
          <div class="spec-item">
            <div class="spec-val" id="specHp">-</div>
            <div class="spec-lbl">Origine</div>
          </div>
          <div class="spec-item">
            <div class="spec-val" id="specEngine">-</div>
            <div class="spec-lbl">Moteur</div>
          </div>
          <div class="spec-item">
            <div class="spec-val" id="specYear">-</div>
            <div class="spec-lbl">Année</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-circle btn-pass" onclick="handleVote(false)">✖</button>
    <button class="btn-circle btn-smash" onclick="handleVote(true)">💚</button>
  </div>

  <div class="modal" id="garageModal">
    <div class="modal-header">
      <h2>🏎 Mon Garage</h2>
      <button class="icon-btn" onclick="toggleGarage()">✕</button>
    </div>
    <div class="garage-grid" id="garageGrid"></div>
  </div>

  <div class="modal" id="detailModal">
    <div class="modal-header">
      <h2>Détails du véhicule</h2>
      <button class="icon-btn" onclick="closeDetail()">✕</button>
    </div>
    <div class="detail-card" id="detailContent"></div>
  </div>

  <script>
    let currentQueue = [];
    let garage = [];
    let judgedCars = [];
    let isAnimating = false;
    let isFetchingAPI = false;

    function checkMonthlyStoragePurge() {
      const lastPurge = localStorage.getItem('smashcar_last_purge');
      const now = Date.now();
      const THIRTY_DAYS = 2592000000;

      if (!lastPurge || (now - parseInt(lastPurge, 10)) > THIRTY_DAYS) {
        localStorage.removeItem('smashcar_judged');
        localStorage.removeItem('smashcar_garage');
        localStorage.setItem('smashcar_last_purge', now.toString());
      }
    }

    function loadSavedData() {
      checkMonthlyStoragePurge();
      const savedJudged = localStorage.getItem('smashcar_judged');
      const savedGarage = localStorage.getItem('smashcar_garage');
      
      if (savedJudged) judgedCars = JSON.parse(savedJudged);
      if (savedGarage) garage = JSON.parse(savedGarage);

      document.getElementById('gBadge').textContent = garage.length;
    }

    function saveState() {
      localStorage.setItem('smashcar_judged', JSON.stringify(judgedCars));
      localStorage.setItem('smashcar_garage', JSON.stringify(garage));
    }

    // API avec tri aléatoire, filtrage des véhicules récents (>= 1970) et type de carrosserie
    async function fetchCarsFromAPI() {
      if (isFetchingAPI) return;
      isFetchingAPI = true;

      const sparqlQuery = `
        SELECT DISTINCT ?car ?carLabel ?image ?manufacturerLabel ?countryLabel ?year ?engineLabel ?bodyTypeLabel WHERE {
          ?car wdt:P31/wdt:P279* wd:Q1420;
               wdt:P18 ?image;
               wdt:P571 ?inception.
          BIND(YEAR(?inception) AS ?year)
          FILTER(?year >= 1970)
          OPTIONAL { ?car wdt:P4100 ?bodyType. }
          OPTIONAL { ?car wdt:P176 ?manufacturer. }
          OPTIONAL { ?car wdt:P495 ?country. }
          OPTIONAL { ?car wdt:P516 ?engine. }
          SERVICE wikibase:label { bd:serviceParam wikibase:language "fr,en". }
        }
        ORDER BY UUID()
        LIMIT 50
      `;

      const url = "https://query.wikidata.org/sparql?query=" + encodeURIComponent(sparqlQuery) + "&format=json";

      try {
        const res = await fetch(url);
        const data = await res.json();
        const results = data.results.bindings;

        const fetched = results.map(r => ({
          id: r.car.value.split('/').pop(),
          name: r.carLabel ? r.carLabel.value : "Voiture",
          category: r.bodyTypeLabel ? r.bodyTypeLabel.value : "Automobile",
          manufacturer: r.manufacturerLabel ? r.manufacturerLabel.value : "Marque inconnue",
          country: r.countryLabel ? r.countryLabel.value : "Monde",
          year: r.year ? r.year.value : "N/C",
          engine: r.engineLabel ? r.engineLabel.value : "Standard",
          img: r.image.value.replace("http://", "https://")
        }));

        // Dédoublonnage strict
        const filtered = fetched.filter(item => 
          !judgedCars.includes(item.id) && 
          !currentQueue.some(q => q.id === item.id)
        );
        
        currentQueue = [...currentQueue, ...filtered];
      } catch (err) {
        console.error("Erreur API Wikidata:", err);
      } finally {
        isFetchingAPI = false;
      }
    }

    async function renderCurrentCard() {
      if (currentQueue.length === 0) {
        document.getElementById('loader').style.display = 'flex';
        document.getElementById('loader').textContent = 'Recherche de nouvelles voitures récentes sur le Web...';
        document.getElementById('cardContent').style.display = 'none';
        document.getElementById('cardImg').style.display = 'none';

        await fetchCarsFromAPI();

        if (currentQueue.length === 0) {
          document.getElementById('loader').innerHTML = "🏁<br>Plus de nouvelles voitures trouvées pour le moment. Réessaye dans un instant !";
          return;
        }
      }

      const car = currentQueue[0];
      const loader = document.getElementById('loader');
      const imgEl = document.getElementById('cardImg');
      const content = document.getElementById('cardContent');

      content.style.display = 'flex';
      loader.style.display = 'flex';
      loader.textContent = 'Chargement de la photo...';
      imgEl.style.display = 'none';

      document.getElementById('carCat').textContent = car.category;
      document.getElementById('carName').textContent = car.name;
      document.getElementById('carSub').textContent = `${car.manufacturer} · ${car.year}`;
      
      document.getElementById('specHp').textContent = car.country;
      document.getElementById('specEngine').textContent = car.engine;
      document.getElementById('specYear').textContent = car.year;

      imgEl.src = car.img;
      imgEl.onload = () => {
        loader.style.display = 'none';
        imgEl.style.display = 'block';
      };
      imgEl.onerror = () => {
        currentQueue.shift();
        renderCurrentCard();
      };

      if (currentQueue.length < 5) fetchCarsFromAPI();
    }

    async function handleVote(isSmash) {
      if (isAnimating || currentQueue.length === 0) return;
      isAnimating = true;

      const card = document.getElementById('cFront');
      const currentCar = currentQueue.shift();

      if (!judgedCars.includes(currentCar.id)) {
        judgedCars.push(currentCar.id);
      }

      card.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
      
      if (isSmash) {
        if (!garage.some(g => g.id === currentCar.id)) {
          garage.push(currentCar);
        }
        document.getElementById('gBadge').textContent = garage.length;
        card.style.transform = 'translateX(150%) rotate(20deg)';
      } else {
        card.style.transform = 'translateX(-150%) rotate(-20deg)';
      }

      saveState();

      setTimeout(async () => {
        card.style.transition = 'none';
        card.style.transform = 'none';
        document.getElementById('stampSmash').style.opacity = '0';
        document.getElementById('stampPass').style.opacity = '0';
        
        await renderCurrentCard();
        
        setTimeout(() => {
          card.style.transition = '';
          isAnimating = false;
        }, 50);
      }, 300);
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') handleVote(false);
      if (e.key === 'ArrowRight') handleVote(true);
    });

    function toggleGarage() {
      const modal = document.getElementById('garageModal');
      modal.classList.toggle('active');
      if (modal.classList.contains('active')) {
        const grid = document.getElementById('garageGrid');
        grid.innerHTML = garage.map((c, i) => `
          <div class="garage-card" onclick="openDetail(${i})">
            <img src="${c.img}" alt="${c.name}"/>
            <div class="garage-card-info">
              <div class="garage-card-name">${c.name}</div>
            </div>
          </div>
        `).join('');
      }
    }

    function openDetail(index) {
      const c = garage[index];
      const modal = document.getElementById('detailModal');
      const container = document.getElementById('detailContent');
      
      container.innerHTML = `
        <img class="detail-img" src="${c.img}" alt="${c.name}"/>
        <div class="detail-body">
          <span class="car-category">${c.category}</span>
          <h2 class="car-title">${c.name}</h2>
          <p class="car-subtitle" style="margin-bottom:16px;">${c.manufacturer} · ${c.year}</p>
          <div class="car-specs">
            <div class="spec-item">
              <div class="spec-val">${c.country}</div>
              <div class="spec-lbl">Origine</div>
            </div>
            <div class="spec-item">
              <div class="spec-val">${c.engine}</div>
              <div class="spec-lbl">Moteur</div>
            </div>
            <div class="spec-item">
              <div class="spec-val">${c.year}</div>
              <div class="spec-lbl">Année</div>
            </div>
          </div>
        </div>
      `;
      modal.classList.add('active');
    }

    function closeDetail() {
      document.getElementById('detailModal').classList.remove('active');
    }

    const front = document.getElementById('cFront');
    let startX = 0, currentX = 0;

    front.addEventListener('pointerdown', e => {
      if (isAnimating || currentQueue.length === 0) return;
      startX = e.clientX;
      front.style.transition = 'none';
      front.setPointerCapture(e.pointerId);
    });

    front.addEventListener('pointermove', e => {
      if (!startX) return;
      currentX = e.clientX - startX;
      const rot = currentX * 0.05;
      front.style.transform = `translateX(${currentX}px) rotate(${rot}deg)`;
      
      const ratio = Math.min(Math.abs(currentX) / 100, 1);
      if (currentX > 0) {
        document.getElementById('stampSmash').style.opacity = ratio;
        document.getElementById('stampPass').style.opacity = 0;
      } else {
        document.getElementById('stampPass').style.opacity = ratio;
        document.getElementById('stampSmash').style.opacity = 0;
      }
    });

    front.addEventListener('pointerup', e => {
      if (!startX) return;
      front.releasePointerCapture(e.pointerId);
      
      if (currentX > 100) handleVote(true);
      else if (currentX < -100) handleVote(false);
      else {
        front.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)';
        front.style.transform = 'none';
        document.getElementById('stampSmash').style.opacity = '0';
        document.getElementById('stampPass').style.opacity = '0';
      }
      startX = 0;
      currentX = 0;
    });

    loadSavedData();
    renderCurrentCard();
  </script>
</body>
</html>
